name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Package
        run: npx @vscode/vsce package --out codewalk-${GITHUB_REF_NAME#v}.vsix
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath codewalk-${GITHUB_REF_NAME#v}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: GitHub release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
